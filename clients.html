<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Clients | Hyori RP</title>
  <link rel="icon" href="img/logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@500;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css?v=9" />
</head>
<body>
  <header class="topbar" id="topbar"></header>

  <main>
    <div class="page-head">
      <div>
        <h1>Les clients</h1>
        <p class="lede">Tous ceux qui ont acheté ou commandé à la forge, retrouvés à partir du registre et des commandes. Un nouveau nom apparaît ici dès sa première vente.</p>
      </div>
      <span class="vertical-mark" lang="ja" aria-hidden="true">顧客</span>
    </div>

    <div class="orders-bar">
      <div class="field field-grow">
        <label for="c-search" class="sr-only">Rechercher un client</label>
        <input id="c-search" type="search" placeholder="Rechercher un client" />
      </div>
      <label class="check"><input type="checkbox" id="c-due" /> Seulement ceux qui doivent encore</label>
    </div>

    <div id="clients"></div>
  </main>

  <script src="js/config.js?v=9"></script>
  <script src="js/store.js?v=9"></script>
  <script src="js/common.js?v=9"></script>
  <script src="js/clients.js?v=9"></script>
</body>
</html>
